<script>
'use strict';
const items=JSON.parse(document.getElementById('data').textContent);
const byId=new Map(items.map(i=>[i.id,i]));const $=id=>document.getElementById(id);
const grid=$('gallery'),dlg=$('lightbox'),query=$('q'),app=$('app'),ui=$('ui'),available=$('availability');
const ROOT='https://raw.githubusercontent.com/riccardopinato/Design-App/';
const github='https://github.com/riccardopinato/Design-App/blob/';
const fileUrl=i=>ROOT+i.ref+'/'+i.path.split('/').map(encodeURIComponent).join('/');
const githubUrl=i=>github+i.ref+'/'+i.path.split('/').map(encodeURIComponent).join('/');
const selectOptions=(el,values)=>[...values].sort((a,b)=>a.localeCompare(b)).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;el.append(o)});
selectOptions(app,new Set(items.flatMap(i=>i.apps)));selectOptions(ui,new Set(items.flatMap(i=>[...i.ui,...i.aesthetic])));
let visible=items.slice(),current=null,lastFocus=null;
function card(i){const b=document.createElement('button');b.type='button';b.className='item';b.setAttribute('aria-label','Mostra anteprima '+i.id+': '+i.title);
const pic=document.createElement('img');pic.src=fileUrl(i);pic.alt='';pic.loading='lazy';pic.decoding='async';
const meta=document.createElement('div');meta.className='meta';const id=document.createElement('strong');id.textContent=i.id+' · '+i.title;
const tags=document.createElement('span');tags.textContent=i.ui.join(', ');const badge=document.createElement('span');badge.className='tag'+(i.source!=='main'?' draft':'');badge.textContent=i.source==='main'?'main':'PR #17';
meta.append(id,tags,badge);b.append(pic,meta);b.addEventListener('click',()=>open(i.id));return b;}
function render(){const q=query.value.trim().toLocaleLowerCase('it');visible=items.filter(i=>
(!q||[i.id,i.title,...i.ui,...i.aesthetic,...i.apps].join(' ').toLocaleLowerCase('it').includes(q))&&
(!app.value||i.apps.includes(app.value))&&(!ui.value||i.ui.includes(ui.value)||i.aesthetic.includes(ui.value))&&
(!available.value||available.value==='main'&&(i.source==='main')||available.value==='draft'&&(i.source!=='main')));
grid.replaceChildren(...visible.map(card));$('count').textContent=visible.length+' di '+items.length+' riferimenti · '+(visible.filter(i=>i.source==='main').length)+' su main, '+visible.filter(i=>i.source!=='main').length+' nella PR #17';$('empty').classList.toggle('off',visible.length!==0)}
function populate(i){current=i.id;$('modalTitle').textContent=i.id+' — '+i.title;$('modalStatus').textContent=i.source;
$('modalImage').src=fileUrl(i);$('modalImage').alt=i.title+' ('+i.id+')';
$('modalTags').textContent='UI: '+i.ui.join(' / ')+' · Estetica: '+i.aesthetic.join(' / ')+' · App: '+i.apps.join(', ');
$('original').href=githubUrl(i);const idx=visible.findIndex(x=>x.id===i.id);$('position').textContent=idx>=0?(idx+1)+' / '+visible.length:'—';}
function open(id){const i=byId.get(id);if(!i)return;lastFocus=document.activeElement;populate(i);if(!dlg.open)dlg.showModal();if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}
function dismiss(){if(dlg.open)dlg.close();if(byId.has(location.hash.slice(1)))history.replaceState(null,'',location.pathname+location.search);lastFocus?.focus?.()}
function advance(step){if(!visible.length)return;let idx=visible.findIndex(i=>i.id===current);if(idx<0)idx=0;open(visible[(idx+step+visible.length)%visible.length].id)}
$('close').addEventListener('click',dismiss);$('prev').addEventListener('click',()=>advance(-1));$('next').addEventListener('click',()=>advance(1));
dlg.addEventListener('click',e=>{if(e.target===dlg)dismiss()});
dlg.addEventListener('cancel',e=>{e.preventDefault();dismiss()});
document.addEventListener('keydown',e=>{if(!dlg.open)return;if(e.key==='ArrowRight')advance(1);if(e.key==='ArrowLeft')advance(-1)});
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(byId.has(id))open(id);else if(dlg.open)dlg.close()});
$('copy').addEventListener('click',async()=>{const url=location.href.split('#')[0]+'#'+current;try{await navigator.clipboard.writeText(url);$('copy').textContent='Copiato';setTimeout(()=>$('copy').textContent='Copia link',1200)}catch(_){window.prompt('Copia questo link',url)}});
for(const e of [query,app,ui,available])e.addEventListener(e===query?'input':'change',render);
render();const deep=decodeURIComponent(location.hash.slice(1));if(byId.has(deep))open(deep);
</script></body></html>
