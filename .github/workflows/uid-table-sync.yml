name: UID catalog — exact source derived image tables

on:
  push:
    branches:
      - feature/uid-reuse-preview-ruixen-20261119
    paths:
      - ".github/workflows/uid-table-sync.yml"
      - "BIBLIOTECA_COMPONENTI/UID_REGISTRY.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate canonical UID image columns and validate
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/uid.py validate
          python -m unittest discover -s BIBLIOTECA_COMPONENTI -p "test_uid.py"
          python BIBLIOTECA_COMPONENTI/validate.py
      - name: Commit derived tables only
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BIBLIOTECA_COMPONENTI/TABELLA_478.md BIBLIOTECA_COMPONENTI/PER_APP BIBLIOTECA_COMPONENTI/ANTEPRIME.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(uid): synchronize image tables with stable UID column"
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git push origin "HEAD:${BRANCH}"
