name: Probe Gentleface Flutter source (read only)

on:
  push:
    branches: ["feature/flutter-dual-code-preview-recovery-20261119"]
    paths:
      - "BIBLIOTECA_COMPONENTI/probe_gentleface_flutter.py"
      - ".github/workflows/probe-gentleface-flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Read official SVG/Flutter source endpoints
        run: python BIBLIOTECA_COMPONENTI/probe_gentleface_flutter.py
