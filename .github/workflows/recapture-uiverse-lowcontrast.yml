name: Re-capture low-contrast Uiverse source animations

on:
  push:
    branches: ["feature/flutter-dual-code-preview-recovery-20261119"]
    paths:
      - "BIBLIOTECA_COMPONENTI/recapture_uiverse_lowcontrast.py"
      - ".github/workflows/recapture-uiverse-lowcontrast.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-app-dual-code-branch-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-css-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install browser and image analysis
        run: |
          python -m pip install "Pillow==11.3.0" "playwright==1.57.0"
          python -m playwright install chromium
      - name: Frame sample exact archived HTML CSS with animations running
        run: python BIBLIOTECA_COMPONENTI/recapture_uiverse_lowcontrast.py
      - name: Rebuild verified UID and image manifests
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/resolve_119_preview_cases.py
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/validate.py
          python BIBLIOTECA_COMPONENTI/uid.py validate
          python BIBLIOTECA_COMPONENTI/audit_anteprime.py
      - name: Save accepted source screenshots and per-ID before-after evidence
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/componenti/UIV-*.png BIBLIOTECA_COMPONENTI/UIVERSE_LOWCONTRAST_RECOVERY.json BIBLIOTECA_COMPONENTI/ANTEPRIME.json BIBLIOTECA_COMPONENTI/TABELLA_478.md BIBLIOTECA_COMPONENTI/PER_APP BIBLIOTECA_COMPONENTI/RECUPERO_119_ESITI.json BIBLIOTECA_COMPONENTI/RECUPERO_119_ESITI.md
          git commit -m "fix(previews): real CSS animation frames for low contrast Uiverse originals"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${BRANCH}"
