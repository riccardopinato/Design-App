name: Batch render all 97 archived missing React TSX originals

on:
  push:
    branches: ["feature/flutter-dual-code-preview-recovery-20261119"]
    paths:
      - "BIBLIOTECA_COMPONENTI/ruixen_renderer/src/batch_main.tsx"
      - "BIBLIOTECA_COMPONENTI/render_archived_tsx_wave.py"
      - ".github/workflows/render-archived-tsx-wave.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-app-dual-code-branch-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install source renderer in tokenless environment
        run: |
          cd BIBLIOTECA_COMPONENTI/ruixen_renderer
          npm install --no-audit --no-fund
          cd ../..
          python -m pip install "playwright==1.57.0" "Pillow==11.3.0"
          python -m playwright install --with-deps chromium
      - name: Capture all remaining immutable licensed React TSX as source-specific demos
        run: python BIBLIOTECA_COMPONENTI/render_archived_tsx_wave.py
      - name: Regenerate real previews, validate SHA and 480 UID
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/validate.py
          python BIBLIOTECA_COMPONENTI/uid.py validate
          python BIBLIOTECA_COMPONENTI/validate_flutter_variants.py
      - name: Commit per-component visual evidence and explicit failed UID diagnostics
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/componenti BIBLIOTECA_COMPONENTI/ANTEPRIME_ORIGINI.json BIBLIOTECA_COMPONENTI/ANTEPRIME_ORIGINI_SECONDARIE.json BIBLIOTECA_COMPONENTI/RENDER_ARCHIVED_TSX_BATCH_REPORT.json BIBLIOTECA_COMPONENTI/ANTEPRIME.json BIBLIOTECA_COMPONENTI/TABELLA_478.md BIBLIOTECA_COMPONENTI/PER_APP
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(previews): capture source-specific original TSX previews with hashes and per-UID failure report"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${BRANCH}"
