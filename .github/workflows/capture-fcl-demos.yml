name: Acquire reference-only Flutter Component Library live-demo previews

on:
  push:
    branches: ["feature/flutter-dual-code-preview-recovery-20261119"]
    paths:
      - "BIBLIOTECA_COMPONENTI/capture_fcl_demos.py"
      - ".github/workflows/capture-fcl-demos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-app-dual-code-branch-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked browser and image runtime
        run: |
          python -m pip install "Pillow==11.3.0" "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Capture 15 official demos as documentary references only
        run: python BIBLIOTECA_COMPONENTI/capture_fcl_demos.py
      - name: Verify catalog consistency and provenance
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/validate.py
          python BIBLIOTECA_COMPONENTI/uid.py validate
      - name: Publish completed PNG and per-ID diagnostics (never license source)
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/componenti BIBLIOTECA_COMPONENTI/ANTEPRIME_ORIGINI_SECONDARIE.json BIBLIOTECA_COMPONENTI/FCL_CAPTURE_REPORT.json BIBLIOTECA_COMPONENTI/ANTEPRIME.json BIBLIOTECA_COMPONENTI/TABELLA_478.md BIBLIOTECA_COMPONENTI/PER_APP
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(previews): archive verified isolated FCL demo screenshots, source-license gate unchanged"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${BRANCH}"
