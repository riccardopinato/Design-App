name: Ruixen verified preview batch — 277 components

on:
  push:
    branches:
      - feature/uid-reuse-preview-ruixen-20261119
    paths:
      - ".github/workflows/ruixen-preview-harvest.yml"
      - "BIBLIOTECA_COMPONENTI/render_ruixen_previews.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruixen-visual-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated image capture dependencies
        run: |
          python -m pip install "Pillow==11.3.0" "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Capture pinned original images and true per-component demos
        run: python BIBLIOTECA_COMPONENTI/render_ruixen_previews.py
        # Official static image recovery only; 66 live demo routes already
        # confirmed unavailable in the previous attempt. Do not recapture.
      - name: Regenerate and validate all per-app visual tables
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/validate.py
      - name: Commit images and manifests to this branch, never main
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/componenti BIBLIOTECA_COMPONENTI/ANTEPRIME_ORIGINI.json BIBLIOTECA_COMPONENTI/ANTEPRIME.json BIBLIOTECA_COMPONENTI/PER_APP BIBLIOTECA_COMPONENTI/TABELLA_478.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(previews): add evidence-pinned Ruixen original images and live demos"
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
