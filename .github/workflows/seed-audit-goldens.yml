name: Seed Corrected Visual QA Golden Baselines (temporary)

on:
  push:
    branches: ["fix/audit-hardening-v27"]
    paths:
      - ".github/workflows/seed-audit-goldens.yml"

permissions:
  contents: write

concurrency:
  group: audit-goldens-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/audit-hardening-v27
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Regenerate PNG baselines with Material icons and real text font
        working-directory: packs/visual-qa/flutter
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          flutter pub get
          flutter analyze lib test
          flutter test test/visual_matrix_test.dart --reporter expanded
          flutter test --update-goldens test/visual_golden_test.dart --reporter expanded
      - name: Verify and commit ONLY the four baseline PNGs
        run: |
          python3 packs/visual-qa/manifest/validate_matrix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/visual-qa/flutter/test/goldens/*.png
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "test(visual-qa): fix Material icon and real-font PNG baselines"
          git push origin HEAD:fix/audit-hardening-v27
