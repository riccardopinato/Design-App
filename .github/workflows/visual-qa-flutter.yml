name: Flutter Visual QA

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "packs/visual-qa/**"
      - ".github/workflows/visual-qa-flutter.yml"

permissions:
  contents: read

jobs:
  flutter-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packs/visual-qa/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Flutter and engine versions
        run: flutter --version
      - name: Verify pinned baseline PNG files and scenario manifest
        working-directory: .
        run: python3 packs/visual-qa/manifest/validate_matrix.py
      - name: Resolve and analyze visual QA package
        run: |
          flutter pub get
          flutter analyze lib test
      - name: Layout, text, insets, states and overlays matrix
        run: flutter test test/visual_matrix_test.dart --reporter expanded
      - name: Verify real test font is available
        run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Pixel regression against COMMITTED baselines
        run: flutter test test/visual_golden_test.dart --reporter expanded
      - name: Full Flutter test suite
        run: flutter test --reporter expanded
      - name: Analyze interactive QA showcase
        working-directory: packs/visual-qa/flutter/example
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test --reporter expanded
      - name: Archive pixel mismatch/diff evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-visual-qa-diffs-${{ github.sha }}
          path: packs/visual-qa/flutter/test/failures/
          if-no-files-found: ignore
          retention-days: 14
