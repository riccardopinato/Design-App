name: Diagnose original Ruixen demo routes — no synthetic previews

on:
  push:
    branches: ["feature/flutter-dual-code-preview-recovery-20261119"]
    paths:
      - "BIBLIOTECA_COMPONENTI/probe_ruixen_missing.py"
      - ".github/workflows/probe-ruixen-missing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
          python BIBLIOTECA_COMPONENTI/probe_ruixen_missing.py
