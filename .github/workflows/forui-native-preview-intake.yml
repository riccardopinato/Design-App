name: Forui Flutter provenance and UID validation

on:
  push:
    branches: ["feature/flutter-forui-component-intake-20261119"]
    paths: ["BIBLIOTECA_COMPONENTI/**", ".github/workflows/forui-native-preview-intake.yml"]
  pull_request:
    paths: ["BIBLIOTECA_COMPONENTI/**", ".github/workflows/forui-native-preview-intake.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate original Flutter source, immutable previews and UID catalog
        run: |
          python BIBLIOTECA_COMPONENTI/validate.py
          python BIBLIOTECA_COMPONENTI/uid.py validate
          python -m unittest discover -s BIBLIOTECA_COMPONENTI -p 'test_uid.py'
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
