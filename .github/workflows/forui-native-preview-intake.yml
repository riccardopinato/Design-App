name: Forui Flutter original code and image intake

on:
  push:
    branches:
      - feature/flutter-forui-component-intake-20261119
    paths:
      - "BIBLIOTECA_COMPONENTI/render_forui_previews.py"
      - ".github/workflows/forui-native-preview-intake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and screenshot dependencies
        run: |
          python -m pip install "Pillow==11.3.0" "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Capture actual Forui Flutter Web demos
        run: python BIBLIOTECA_COMPONENTI/render_forui_previews.py
      - name: Regenerate all image tables and verify original code SHA
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/validate.py
      - name: Push only screenshot/derived content back to feature branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/componenti/FUI-001.png docs/assets/componenti/FUI-002.png BIBLIOTECA_COMPONENTI/ANTEPRIME_ORIGINI_FORUI.json BIBLIOTECA_COMPONENTI/ANTEPRIME.json BIBLIOTECA_COMPONENTI/TABELLA_478.md BIBLIOTECA_COMPONENTI/PER_APP
          git commit -m "docs(forui): record real original Flutter button and credential form visual references"
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git push origin "HEAD:${BRANCH}"
