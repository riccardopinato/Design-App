name: Account all 119 baseline missing previews with per-UID evidence

on:
  # Ledger regeneration is part of the source renderer's single commit.
  # A separate automatic writer conflicted with image+ledger commits;
  # keep this independent audit available via explicit dispatch only.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-app-119-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert all original 119 UIDs accounted, verify PNG byte-level provenance
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/resolve_119_preview_cases.py
      - name: Commit machine-readable and human-readable 119-row outcome ledger
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BIBLIOTECA_COMPONENTI/RECUPERO_119_ESITI.json BIBLIOTECA_COMPONENTI/RECUPERO_119_ESITI.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(previews): document evidence or individual blockers for all baseline 119 UIDs"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${BRANCH}"
