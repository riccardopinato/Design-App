name: Component preview visual QA contact sheet

on:
  pull_request:
    paths:
      - "docs/assets/componenti/**"
      - "BIBLIOTECA_COMPONENTI/**"
      - ".github/workflows/component-preview-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-preview-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect canonical preview manifest
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/audit_anteprime.py
      - name: Upload review contact sheet and objective pixel metrics
        uses: actions/upload-artifact@v4
        with:
          name: design-component-preview-qa-110
          path: preview-qa-output/
          if-no-files-found: error
          retention-days: 30
