name: Semantic Sound Pack

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "packs/sound/**"
      - ".github/workflows/semantic-sound-pack.yml"

permissions:
  contents: read

jobs:
  sound-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packs/sound/adapters/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact CC0 audio bytes and metadata
        run: python3 packs/sound/semantic/validate_assets.py
        working-directory: .
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Flutter SDK version
        run: flutter --version
      - name: Resolve Flutter sound adapter
        run: flutter pub get
      - name: Analyze sound adapter
        run: flutter analyze lib test
      - name: Test semantic sound controller and asset bundle
        run: flutter test --reporter expanded
      - name: Resolve example
        working-directory: packs/sound/adapters/flutter/example
        run: flutter pub get
      - name: Analyze interactive sound showcase
        working-directory: packs/sound/adapters/flutter/example
        run: flutter analyze lib
