name: Render unchanged MIT Ruixen TSX with isolated React — first batch

on:
  push:
    branches: ["feature/flutter-dual-code-preview-recovery-20261119"]
    paths:
      - "BIBLIOTECA_COMPONENTI/ruixen_renderer/**"
      - "BIBLIOTECA_COMPONENTI/render_ruixen_from_tsx.py"
      - ".github/workflows/render-ruixen-from-tsx.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-app-dual-code-branch-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned TSX demo dependencies with no repo tokens
        run: |
          cd BIBLIOTECA_COMPONENTI/ruixen_renderer
          npm install --no-fund --no-audit
          cd ../..
          python -m pip install "Pillow==11.3.0" "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Capture true pinned original TSX, reject blank or wrong screenshots
        run: python BIBLIOTECA_COMPONENTI/render_ruixen_from_tsx.py
      - name: Regenerate full catalog and verify original SHA provenance
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/validate.py
          python BIBLIOTECA_COMPONENTI/validate_flutter_variants.py
      - name: Commit only authentic isolated component renders, never overwrite originals
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/componenti BIBLIOTECA_COMPONENTI/ANTEPRIME_ORIGINI.json BIBLIOTECA_COMPONENTI/RU_TSX_RENDER_REPORT.json BIBLIOTECA_COMPONENTI/ANTEPRIME.json BIBLIOTECA_COMPONENTI/TABELLA_478.md BIBLIOTECA_COMPONENTI/PER_APP
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(previews): recover source-faithful Ruixen images from pinned unchanged React TSX"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${BRANCH}"
