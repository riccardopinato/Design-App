name: Icon Adapter Pack

on:
  pull_request:
    paths:
      - "packs/icons/**"
      - ".github/workflows/icon-adapter-pack.yml"
  push:
    branches: ["main"]
    paths:
      - "packs/icons/**"
      - ".github/workflows/icon-adapter-pack.yml"

permissions:
  contents: read

jobs:
  manifest:
    name: icon-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify generated Flutter and Compose parity
        run: python3 packs/icons/manifest/generate.py --check
      - name: Run manifest policy tests
        run: python3 -m unittest discover -s packs/icons/manifest -p 'test_*.py'

  flutter:
    name: icon-flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packs/icons/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Analyze Flutter icon adapter
        run: |
          flutter pub get
          flutter analyze lib test
      - name: Run Flutter widget tests
        run: flutter test --reporter expanded
      - name: Analyze Flutter showcase
        working-directory: packs/icons/flutter/example
        run: |
          flutter pub get
          flutter analyze lib

  compose:
    name: icon-compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14"
      - name: Compile and test Compose icon adapter
        working-directory: packs/icons/compose
        run: gradle --no-daemon test --stacktrace
