name: Complete Gentleface paused icon from MIT original SVG

on:
  push:
    branches: ["feature/flutter-dual-code-preview-recovery-20261119"]
    paths:
      - "BIBLIOTECA_COMPONENTI/render_gentleface_pause.py"
      - ".github/workflows/render-gentleface-pause.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-app-dual-code-branch-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-original-svg:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Render authentic MIT original SVG with isolated CairoSVG
        run: |
          python -m pip install "Pillow==11.3.0" "CairoSVG==2.8.2"
          python BIBLIOTECA_COMPONENTI/render_gentleface_pause.py
      - name: Generate markdown and validate image SHA256
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/validate.py
          python BIBLIOTECA_COMPONENTI/validate_flutter_variants.py
      - name: Commit actual verified original preview to feature branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/componenti/ICO-021.png BIBLIOTECA_COMPONENTI/ANTEPRIME_ORIGINI_GENTLEFACE.json BIBLIOTECA_COMPONENTI/ANTEPRIME.json BIBLIOTECA_COMPONENTI/TABELLA_478.md BIBLIOTECA_COMPONENTI/PER_APP BIBLIOTECA_COMPONENTI/RECUPERO_ANTEPRIME_2026-11-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(previews): render official MIT pause SVG and complete Gentleface preview coverage"
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git push origin "HEAD:${BRANCH}"
