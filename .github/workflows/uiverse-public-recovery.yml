name: Uiverse Public Code Recovery (read-only external fetch)

on:
  pull_request:
    paths:
      - "scripts/uiverse_recover_public.py"
      - "scripts/uiverse_apply_public.py"
      - ".github/workflows/uiverse-public-recovery.yml"

permissions:
  contents: write

jobs:
  recovery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install minimal HTTP dependency
        run: python -m pip install "curl_cffi>=0.7,<1"
      - name: Fetch public Uiverse originals (up to 43, no authentication)
        run: python scripts/uiverse_recover_public.py --limit 43 --output-dir out/uiverse
      - name: Archive recovered originals and validate catalog
        run: |
          python scripts/uiverse_apply_public.py --source out/uiverse
          python scripts/validate_design_library.py
      - name: Commit snapshots and source metadata to the current PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UI-UX/UIVERSE PER_APP README.md UI-UX/README.md sources/UIVERSE_FAVORITES_97_AUDIT_2026-11-18.md
          if git diff --cached --quiet; then
            echo "No recovered source changes to commit"
            exit 0
          fi
          git commit -m "docs(design): recover Uiverse public HTML/CSS originals with source hashes"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload public recovery manifest and source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiverse-public-recovery-all
          path: out/uiverse/
          if-no-files-found: warn
          retention-days: 7
