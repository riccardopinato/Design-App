name: Uiverse Public Code Recovery (read-only)

on:
  pull_request:
    paths:
      - "scripts/uiverse_recover_public.py"
      - ".github/workflows/uiverse-public-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install narrow HTTP client dependency
        run: python -m pip install "curl_cffi>=0.7,<1"
      - name: Probe missing Uiverse source code
        run: python scripts/uiverse_recover_public.py --limit 2 --output-dir out/uiverse
      - name: Store public-source probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiverse-public-recovery-probe
          path: out/uiverse/
          if-no-files-found: warn
          retention-days: 7
