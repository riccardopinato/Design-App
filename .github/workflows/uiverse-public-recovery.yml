name: Uiverse Favorites Refresh — public code recovery

on:
  pull_request:
    paths:
      - "UI-UX/UIVERSE/FAVORITES/EXPORT_2026-11-18T16-40-39Z.json"
      - "scripts/uiverse_apply_public.py"
      - ".github/workflows/uiverse-public-recovery.yml"

permissions:
  contents: write

jobs:
  recovery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install public HTTP client
        run: python -m pip install "curl_cffi>=0.7,<1"
      - name: Recover the 11 new Uiverse favorites (public endpoints only)
        run: python scripts/uiverse_recover_public.py --limit 11 --output-dir out/uiverse
      - name: Integrate evidence and run validator
        run: |
          python scripts/uiverse_apply_public.py --source out/uiverse
          python scripts/validate_design_library.py
      - name: Commit source snapshots to this PR (never main directly)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UI-UX/UIVERSE PER_APP README.md UI-UX/README.md sources/UIVERSE_FAVORITES_97_AUDIT_2026-11-18.md
          if git diff --cached --quiet; then
            echo "No public original sources acquired"
            exit 0
          fi
          git commit -m "docs(design): archive 11 new Uiverse HTML/CSS sources and checksums"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload manifest for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiverse-favorites-refresh-108-recovery
          path: out/uiverse/
          if-no-files-found: warn
          retention-days: 7
