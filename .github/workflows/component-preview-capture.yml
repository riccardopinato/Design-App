name: Component previews — canonical image capture

on:
  push:
    branches:
      - feature/component-preview-gallery-478-20261119
    paths:
      - ".github/workflows/component-preview-capture.yml"
      - "BIBLIOTECA_COMPONENTI/genera_anteprime.py"
      - "BIBLIOTECA_COMPONENTI/render_uiverse_previews.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: component-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.repository == 'riccardopinato/Design-App'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated screenshot renderer
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Capture Uiverse original HTML/CSS previews (no JS, no remote assets)
        run: python BIBLIOTECA_COMPONENTI/render_uiverse_previews.py
      - name: Regenerate all 478 preview metadata and per-app Markdown image columns
        run: |
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --write
          python BIBLIOTECA_COMPONENTI/genera_anteprime.py --check
          python BIBLIOTECA_COMPONENTI/validate.py
      - name: Commit only generated preview assets and derived tables to this feature branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/componenti BIBLIOTECA_COMPONENTI/ANTEPRIME.json BIBLIOTECA_COMPONENTI/PER_APP BIBLIOTECA_COMPONENTI/TABELLA_478.md
          if git diff --cached --quiet; then
            echo "No derived changes"
            exit 0
          fi
          git commit -m "docs(previews): add locally rendered Uiverse thumbnails and per-app image tables"
          # Preserve concurrent human/documentation changes; never force-push.
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git push origin "HEAD:${BRANCH}"
